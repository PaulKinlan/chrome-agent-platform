[package]
name = "jxl-tool"
version = "1.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "CAP-authored WASI JPEG XL decoder over jxl-oxide: base64 JXL on stdin -> raw PNG bytes on stdout (chrome-agent-platform-agpu)"

[[bin]]
name = "jxl"
path = "src/main.rs"

[dependencies]
jxl-oxide = { version = "=0.12.6", default-features = false }
png = { version = "=0.17.16", default-features = false }
base64 = "=0.22.1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
