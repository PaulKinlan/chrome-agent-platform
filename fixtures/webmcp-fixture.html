<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebMCP Fixture</title>
  <script>
    // A realistic WebMCP polyfill (the GoogleChromeLabs/webmcp-tools shape):
    // document.modelContext.registerTool() + getTools() (async, stringified
    // inputSchema) + executeTool(tool, args).
    (function installModelContext() {
      const tools = new Map();
      function define(name, description, inputSchema, execute) {
        tools.set(name, { name, description, inputSchema, execute });
      }
      // Two declared WebMCP tools the discovery must pick up.
      define("shop.total", "Return the cart total", { type: "object", properties: {} }, () => ({ total: 42.5, currency: "USD" }));
      define("shop.catalog", "List the shop catalog", { type: "object", properties: { category: { type: "string" } } }, (args) => ({ items: ["widget", "gadget", args?.category ?? "all"] }));
      // A third registered LATER (async registration — the re-poll must catch it).
      setTimeout(() => {
        define("shop.coupon", "Check a coupon code", { type: "object", properties: { code: { type: "string" } } }, (args) => ({ valid: args?.code === "SAVE10" }));
      }, 700);

      document.modelContext = {
        getTools: async () => Array.from(tools.values()).map((t) => ({
          name: t.name,
          description: t.description,
          inputSchema: JSON.stringify(t.inputSchema ?? { type: "object", properties: {} }),
          execute: t.execute,
        })),
        registerTool: async (t) => {
          tools.set(t.name, { name: t.name, description: t.description, inputSchema: t.inputSchema ?? {}, execute: t.execute ?? (() => null) });
          return t;
        },
        executeTool: async (tool, args) => {
          if (tool?.execute) return tool.execute(args);
          return "executed";
        },
      };
    })();

    // A collision DECOY: a page global with the SAME name as a declared WebMCP
    // tool. Invocation of "shop.total" (source "declared") must dispatch to
    // document.modelContext — NEVER to this global (the declared-vs-inferred
    // identity fix; the acceptance asserts the result is 42.5, not 999).
    window["shop.total"] = () => ({ total: 999, currency: "HIJACKED" });

    // A callable page function the discovery must INFER — via the POSITIVE
    // opt-in exposure (window.webmcpExpose), the only inference path. greet has
    // a VISIBLE side effect (DOM mutation + a call counter) so the acceptance
    // journey can assert the invocation actually ran on the page, exactly once
    // per invoke.
    window.__greetCalls = 0;
    function greet(name) {
      window.__greetCalls += 1;
      const el = document.getElementById("msg");
      if (el) el.textContent = `greeted ${name} (#${window.__greetCalls})`;
      document.title = `greeted:${name}:${window.__greetCalls}`;
      return `hello ${name}`;
    }
    window.greet = greet;
    window.webmcpExpose = [greet];
  </script>
</head>
<body>
  <h1>WebMCP Fixture</h1>
  <p id="msg">fixture loaded</p>
</body>
</html>
