<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mood D — Terminal</title><style>
:root{--bg:#0a0f0a;--panel:#101810;--border:#1f331f;--text:#c8ffc8;--muted:#5f8f5f;--accent:#3f6;--green:#3f6;--red:#f66;--purple:#b9f;--gold:#fc6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:32px;max-width:760px}
h1{font-size:17px;margin:0 0 4px}.tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.composer{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:16px;margin:20px 0;position:relative}
.composer textarea{width:100%;background:transparent;border:0;color:var(--text);font:inherit;resize:vertical;min-height:60px;outline:none;caret-color:var(--green)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.spacer{flex:1}
.btn{background:var(--accent);color:#001;border:0;border-radius:4px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip .dot{width:7px;height:7px;border-radius:1px;background:var(--green)}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from 0deg,var(--green),var(--accent),var(--gold),var(--green));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1;filter:blur(0.5px);animation:g 4s linear infinite}
@keyframes g{to{filter:blur(0.5px) hue-rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.glow::before{animation:none;filter:none}}
.agent{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin:6px 0}
</style></head><body>
<h1>Chrome Agent Platform</h1><div class="tag">Terminal — mono, phosphor green</div>
<div class="composer glow"><textarea placeholder="Ask anything — or @mention a site agent…"></textarea>
<div class="row"><div class="chip"><span class="dot"></span><span>agent ready</span></div><span class="spacer"></span><button class="btn">Run task</button></div></div>
<div class="tag">Recipes</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
<span class="chip">🧹 Tab hygiene</span><span class="chip">📄 Summarise</span><span class="chip">🔗 Collect links</span><span class="chip">📚 Reading list</span></div>
<div class="tag">Site agents</div>
<div class="agent"><span>@github</span><span style="color:var(--muted)">12 tools</span></div>
<div class="agent"><span>@aifocus</span><span style="color:var(--muted)">8 tools</span></div>
</body></html>
