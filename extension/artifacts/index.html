<!doctype html>
<html lang="en">
<head><link rel="icon" href="../icons/icon16.png">

<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifacts — Chrome Agent Platform</title>
<link rel="stylesheet" href="../shared/theme.css">
<script type="module" src="../shared/components.js"></script>
<style>
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.01em; }
  .logo span { color: var(--accent); }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px; }
  .empty { color: var(--muted); padding: 24px 0; }
  .status { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .foot { margin-top: 24px; color: var(--muted); font-size: 12px; }
  /* Native delete-confirmation dialog (the direct owner action). */
  dialog.delete-dialog { border: 1px solid var(--border); border-radius: var(--radius-md, 10px);
    background: var(--panel); color: var(--text); padding: 18px 20px; max-width: min(92vw, 420px); }
  dialog.delete-dialog::backdrop { background: rgb(0 0 0 / 0.35); }
  dialog.delete-dialog h3 { margin: 0 0 8px; font-size: 16px; }
  dialog.delete-dialog p { margin: 0 0 16px; font-size: 13px; color: var(--muted);
    overflow-wrap: anywhere; }
  .dialog-controls { display: flex; justify-content: flex-end; gap: 8px; }
  .dialog-controls button { font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer;
    border-radius: var(--radius-sm, 6px); border: 1px solid var(--border); background: transparent;
    color: var(--text); }
  .dialog-controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dialog-controls button.danger { border-color: var(--danger, #b3261e); color: var(--danger, #b3261e); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Item 54: opened IN-CONTEXT from the hub (the view overlay provides the
       single Back button + the "Artifacts" title), so this page has NO back
       button and NO h1 of its own — a small logo only, matching the recipes
       page. The old back + h1 doubled up with the overlay's header. -->
  <header class="head">
    <div class="logo">Artifacts</div>
  </header>
  <p class="sub">Everything the agents have made — generated pages, files, data, UI fragments. Click a card to open it live; Reuse attaches it to a new task; Delete removes it.</p>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</div>
<script type="module" src="./index.js"></script>
</body>
</html>
