<!doctype html>
<html lang="en">
<head><link rel="icon" href="../icons/icon16.png">

<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
<title>Artifacts — Chrome Agent Platform</title>
<link rel="stylesheet" href="../shared/theme.css">
<script>
  if (new URLSearchParams(location.search).get("embedded") === "1" || window.self !== window.top) {
    document.documentElement.dataset.embedded = "1";
  }
</script>
<script type="module" src="../shared/components.js"></script>
<style>
  .wrap { max-inline-size: var(--content-max); margin-inline: auto; padding-inline: var(--content-gutter); padding-block: 24px; }
  [data-embedded] .head { display: none; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.01em; }
  .logo span { color: var(--accent); }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px; }
  .empty { color: var(--muted); padding: 24px 0; }
  .status { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .foot { margin-top: 24px; color: var(--muted); font-size: 12px; }
  /* CAP-FB-20260828-ARTIFACT-LIBRARY-CAPACITY-01 — the library capacity
     indicator: the owner sees a filling library BEFORE a create is refused,
     never as a silent drop. Hidden until the library is meaningfully full. */
  .capacity { margin: 0 0 16px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: var(--radius-sm, 6px); background: var(--surface-2, transparent);
    font-size: 12px; color: var(--muted); }
  .capacity[hidden] { display: none; }
  .capacity .cap-row { display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-bottom: 6px; }
  .capacity .cap-label { color: var(--text); font-weight: 600; }
  .capacity .cap-bar { height: 6px; border-radius: 3px; background: var(--border);
    overflow: hidden; }
  .capacity .cap-fill { height: 100%; background: var(--accent); width: 0; }
  .capacity.warn .cap-fill { background: #e0a400; }
  .capacity.full .cap-fill { background: #d64545; }
  .capacity.full { border-color: #d64545; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Item 54: opened IN-CONTEXT from the hub (the view overlay provides the
       single Back button + the "Artifacts" title), so this page has NO back
       button and NO h1 of its own — a small logo only, matching the recipes
       page. The old back + h1 doubled up with the overlay's header. -->
  <header class="head">
    <div class="logo">Artifacts</div>
  </header>
  <p class="sub">Everything the agents have made — generated pages, files, data, UI fragments. Click a card to open it live; Reuse attaches it to a new task; Delete removes it.</p>
  <div class="capacity" id="capacity" role="status" aria-live="polite" hidden></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</div>
<script type="module" src="./index.js"></script>
</body>
</html>
