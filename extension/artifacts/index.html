<!doctype html>
<html lang="en">
<head><link rel="icon" href="../icons/icon16.png">

<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
<title>Artifacts — Chrome Agent Platform</title>
<link rel="stylesheet" href="../shared/theme.css">
    <script src="../shared/embedded-boot.js"></script>
<style>
  .wrap {
    max-inline-size: var(--content-max);
    max-inline-size: 1680px;
    width: 100%;
    box-sizing: border-box;
    margin-inline: auto;
    padding-inline: var(--content-gutter);
    padding-inline: clamp(16px, 2.5vw, 36px);
    padding-block: 20px;
  }
  [data-embedded] .head { display: none; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.01em; }
  .logo span { color: var(--accent); }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; line-height: 1.4; }

  /* Toolbar: Search input + kind pill filter bar + live status */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1 1 240px;
    min-width: 180px;
    max-width: 380px;
    height: 34px;
    padding: 0 12px;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm, 6px);
    background: var(--panel);
    color: var(--text);
    box-sizing: border-box;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .kind-pills {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--panel-2);
    padding: 3px;
    border-radius: var(--radius-sm, 6px);
    border: 1px solid var(--border);
  }
  .kind-pill {
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .kind-pill:hover { color: var(--text); }
  .kind-pill.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow-1);
    font-weight: 600;
  }
  .status { color: var(--muted); font-size: 12.5px; margin-left: auto; }

  /* Workspace: Responsive split grid + side inspector */
  .workspace {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    width: 100%;
    min-width: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    flex: 1 1 55%;
    min-width: 0;
    align-content: start;
  }
  .grid:has(empty-state) { display: block; }
  .empty { color: var(--muted); padding: 24px 0; font-size: 13px; grid-column: 1 / -1; }

  /* Side-by-side Inspector */
  .inspector {
    flex: 0 0 min(52%, 780px);
    position: sticky;
    top: 16px;
    height: calc(100vh - 96px);
    min-height: 520px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius-md, 12px);
    background: var(--panel);
    overflow: hidden;
    box-shadow: var(--shadow-2);
  }
  .inspector[hidden] { display: none !important; }
  @media (max-width: 959px) {
    .inspector { display: none !important; }
  }

  .insp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .insp-meta-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .insp-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .insp-meta {
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .insp-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .insp-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 8px;
    font: inherit;
    font-size: 11.5px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm, 6px);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .insp-btn:hover { border-color: var(--accent); color: var(--accent); }
  .insp-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .insp-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .insp-close {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .insp-close:hover { color: var(--text); background: var(--panel-2); }

  .insp-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    position: relative;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  .insp-body .html-frame {
    width: 100%;
    height: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .insp-body .html-frame iframe {
    width: 100%;
    height: 100%;
    flex: 1;
    border: 0;
    background: transparent;
  }
  .insp-body img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    margin: auto;
    padding: 16px;
    box-sizing: border-box;
  }
  .insp-body pre {
    margin: 0;
    padding: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    overflow: auto;
    height: 100%;
    box-sizing: border-box;
  }

  artifact-card.selected {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--radius-md, 12px);
  }

  .foot { margin-top: 24px; color: var(--muted); font-size: 12px; }
  .capacity { margin: 0 0 16px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: var(--radius-sm, 6px); background: var(--panel-2);
    font-size: 12px; color: var(--muted); }
  .capacity[hidden] { display: none; }
  .capacity .cap-row { display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-bottom: 6px; }
  .capacity .cap-label { color: var(--text); font-weight: 600; }
  .capacity .cap-bar { height: 6px; border-radius: 3px; background: var(--border);
    overflow: hidden; }
  .capacity .cap-fill { height: 100%; background: var(--accent); width: 0; }
  .capacity.warn .cap-fill { background: #e0a400; }
  .capacity.full .cap-fill { background: #d64545; }
  .capacity.full { border-color: #d64545; }
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1 class="logo" data-i18n="artifacts_title">Artifacts</h1>
  </header>
  <p class="sub" data-i18n="artifacts_sub">Everything the agents have made — generated pages, files, data, UI fragments. Click a card to open it live; Reuse attaches it to a new task; Delete removes it.</p>
  <div class="capacity" id="capacity" role="status" aria-live="polite" hidden></div>
  <div class="toolbar" id="toolbar">
    <input type="search" id="q" class="search-input" placeholder="Search artifacts by title or origin…" aria-label="Search artifacts">
    <div class="kind-pills" id="kind" role="tablist" aria-label="Filter by type">
      <button type="button" class="kind-pill active" data-kind="" role="tab" aria-selected="true">All</button>
      <button type="button" class="kind-pill" data-kind="html" role="tab" aria-selected="false">Pages</button>
      <button type="button" class="kind-pill" data-kind="markdown" role="tab" aria-selected="false">Notes</button>
      <button type="button" class="kind-pill" data-kind="data" role="tab" aria-selected="false">Data</button>
      <button type="button" class="kind-pill" data-kind="image" role="tab" aria-selected="false">Images</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <div class="workspace" id="artifacts-workspace">
    <div class="grid" id="grid"></div>
    <aside class="inspector" id="artifact-inspector" aria-label="Artifact preview" hidden></aside>
  </div>
  <div class="foot" id="foot"></div>
</main>
<script type="module" src="../dist/artifacts.bundle.js"></script>
</body>
</html>
