<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="../icons/icon16.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent directory — sites as agents</title>
  <link rel="stylesheet" href="../shared/theme.css">
    <script src="../shared/embedded-boot.js"></script>
  <style>
    body { min-inline-size:0; overflow-x:clip; }
    .wrap { max-inline-size:var(--content-max); min-inline-size:0; margin-inline:auto;
      padding-inline:var(--content-gutter); padding-block:24px; }
    [data-embedded] .head,
    [data-embedded] #directory-title { display:none; }
    .head { margin:0 0 24px; }
    h1 { margin:0 0 6px; font-size:var(--text-xl); }
    .sub { margin:0; max-inline-size:72ch; color:var(--muted); font-size:13px; }
    #rows { display:grid; gap:20px; min-inline-size:0; }
    .site-group { display:grid; gap:10px; min-inline-size:0; }
    .site-heading { margin:0; min-inline-size:0; color:var(--text); font-size:var(--text-lg);
      overflow-wrap:anywhere; }
    .policy-row { display:flex; flex-wrap:wrap; align-items:safe center; gap:6px 12px;
      min-inline-size:0; }
    .policy-select { min-block-size:36px; max-inline-size:100%; padding:4px 8px;
      border:1px solid var(--border,#e3e0d9); border-radius:var(--radius-sm,6px);
      background:var(--panel,#fff); color:var(--text,#1d1b18);
      font:600 var(--text-sm,13px)/1.4 inherit; }
    .policy-note { margin:0; min-inline-size:0; color:var(--muted);
      font-size:var(--text-xs,12px); line-height:1.5; overflow-wrap:anywhere; }
    .tool-list { display:grid; grid-template-columns:minmax(0,1fr); gap:10px;
      min-inline-size:0; margin:0; padding:0; list-style:none; }
    .tool-list > li { min-inline-size:0; }
    .empty { margin:0; color:var(--muted); }
    @media (forced-colors:active) { .site-heading { forced-color-adjust:auto; } }
  </style>
</head>
<body>
  <main class="wrap" aria-labelledby="directory-title">
    <header class="head">
      <h1 id="directory-title" data-i18n="directory_title">Directory</h1>
      <p class="sub" data-i18n="directory_sub">Sites that offer agent tools will appear here automatically as you browse.</p>
    </header>
    <div id="rows" aria-live="polite"></div>
  </main>
  <script type="module" src="../dist/directory.bundle.js"></script>
</body>
</html>
