<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent directory — sites as agents</title>
<link rel="stylesheet" href="../shared/theme.css">
    <script type="module" src="../shared/apply-theme.js"></script>
<style>
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
  .origin { font-weight: 700; min-width: 140px; }
  .tools { flex: 1; color: var(--muted); font-size: 13px; }
  .src { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .src.declared { color: var(--accent2); border-color: var(--accent2); }
  .src.inferred { color: var(--accent); border-color: var(--accent); }
  .approve { background: var(--accent); color: #001; border: 0; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Agent directory</h1>
  <div class="sub">Every origin the agent has visited becomes a sub-agent. Tools are declared (WebMCP), linked (agent.md/skills), or inferred (window.* functions). First-run approval per tool.</div>
  <div id="rows"></div>
</div>
<script type="module" src="directory.js"></script>
</body>
</html>
