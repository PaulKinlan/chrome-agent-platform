<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="../icons/icon16.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent directory — sites as agents</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <script type="module" src="../shared/apply-theme.js"></script>
  <script type="module" src="../shared/components.js"></script>
  <style>
    body { min-inline-size:0; overflow-x:clip; }
    .wrap { inline-size:min(100%, 960px); min-inline-size:0; margin-inline:auto;
      padding:clamp(16px, 4cqi, 32px); }
    h1 { margin:0 0 6px; font-size:var(--text-xl); }
    .sub { margin:0 0 24px; max-inline-size:72ch; color:var(--muted); }
    #rows { display:grid; gap:20px; min-inline-size:0; }
    .site-group { display:grid; gap:10px; min-inline-size:0; }
    .site-heading { margin:0; min-inline-size:0; color:var(--text); font-size:var(--text-lg);
      overflow-wrap:anywhere; }
    .tool-list { display:grid; grid-template-columns:minmax(0,1fr); gap:10px;
      min-inline-size:0; margin:0; padding:0; list-style:none; }
    .tool-list > li { min-inline-size:0; }
    .empty { margin:0; color:var(--muted); }
    @media (forced-colors:active) { .site-heading { forced-color-adjust:auto; } }
  </style>
</head>
<body>
  <main class="wrap" aria-labelledby="directory-title">
    <h1 id="directory-title">Agent directory</h1>
    <p class="sub">Every enrolled site can provide declared WebMCP, linked, or inferred functions. Each function shows its own source, schema, and approval state.</p>
    <div id="rows" aria-live="polite"></div>
  </main>
  <script type="module" src="directory.js"></script>
</body>
</html>
