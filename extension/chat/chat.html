<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — agent conversation</title>
<link rel="stylesheet" href="../shared/theme.css">
    <script type="module" src="../shared/apply-theme.js"></script>
<style>
  body { margin: 0; }
  .wrap { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; padding: 20px; height: 100vh; box-sizing: border-box; }
  .chat { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .chat .head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .chat .body { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #001; }
  .msg.agent { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .msg .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .shots { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; border-top: 1px solid var(--border); }
  .shot { flex: 0 0 auto; width: 96px; height: 64px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; cursor: pointer; }
  .composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .composer input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; font: inherit; }
  .side { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .side .head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px; }
  .side .page { flex: 1; background: var(--bg); margin: 12px; border-radius: 8px; border: 1px solid var(--border); padding: 14px; overflow: auto; }
  .side .page .url { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="chat">
    <div class="head" id="head">Agent conversation</div>
    <div class="body" id="body" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="shots" id="shots" aria-label="Screenshot history"></div>
    <div class="composer">
      <label class="sr-only" for="input">Message</label>
      <input id="input" placeholder="Reply, or @mention a site agent…">
      <button class="btn" id="send">Send</button>
    </div>
  </div>
  <div class="side">
    <div class="head">Side panel — driven page</div>
    <div class="page" id="sidepage">
      <div class="url" id="sideurl">—</div>
      <div class="tag">controlled by agent</div>
      <p style="color:var(--muted)">Open the side panel to see the driven page. The morph surface melds 2–3 sites.</p>
    </div>
  </div>
</div>
<script type="module" src="chat.js"></script>
</body>
</html>
