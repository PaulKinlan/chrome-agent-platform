<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — agent conversation</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/composer.css">
    <script type="module" src="../shared/apply-theme.js"></script>
    <script type="module" src="../shared/components.js"></script>
<style>
  body { margin: 0; }
  .wrap { display: flex; flex-direction: column; padding: 20px; height: 100vh; box-sizing: border-box; max-width: 900px; margin: 0 auto; }
  .chat { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; flex: 1; }
  .chat .head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chat .head .spacer { flex: 1; }
  .chat .body { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--btn-fg); }
  .msg.agent { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .msg .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .shots { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; border-top: 1px solid var(--border); }
  .shot { flex: 0 0 auto; width: 96px; height: 64px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; cursor: pointer; }
  .composer { border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="chat">
    <div class="head" id="head">
      <span>Agent conversation</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="open-side-panel" title="Open the Chrome side panel (the driven page)">Side panel</button>
    </div>
    <div class="body" id="body" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="shots" id="shots" aria-label="Screenshot history"></div>
    <agent-composer id="composer" placeholder="Reply, or @mention a site agent…" send-label="Send"></agent-composer>
  </div>
</div>
<script type="module" src="chat.js"></script>
</body>
</html>
