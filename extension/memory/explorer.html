<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory explorer</title>
<link rel="stylesheet" href="../shared/theme.css">
    <script type="module" src="../shared/apply-theme.js"></script>
<style>
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .master { background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 20px; }
  .master h2 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
  .agents { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mem { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; }
  .mem .origin { font-weight: 700; margin-bottom: 6px; }
  .kv { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding: 4px 0; }
  .kv b { color: var(--text); font-weight: 500; }
  .actions { margin-top: 8px; display: flex; gap: 6px; }
  .usage { margin-top: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; }
  .usage h2 { margin: 0 0 8px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 6px 8px; border-top: 1px solid var(--border); }
  .shots { margin-top: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; }
  .shots h2 { margin: 0 0 8px; font-size: 14px; }
  .shot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .shot { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .shot img { display: block; width: 100%; height: auto; }
  .shot .shot-meta { font-size: var(--text-xs); color: var(--muted); padding: 4px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shot a { display: block; font-size: var(--text-xs); padding: 4px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Memory explorer</h1>
  <div class="sub">Origin-keyed OPFS memory: one store for the master agent, one per Site Agent. One origin cannot read another's store. Inspect, export, or clear.</div>

  <div class="master" id="master"></div>
  <div class="agents" id="agents"></div>
  <div class="shots">
    <h2>Screenshots (captured tabs)</h2>
    <div class="shot-grid" id="shots"></div>
  </div>
  <div class="usage">
    <h2>Usage (agent accounting)</h2>
    <div id="usage-summary" style="color:var(--muted); margin-bottom:8px;"></div>
    <table id="usage-table"><thead><tr><th>model</th><th>calls</th><th>tokens in</th><th>tokens out</th><th>cost</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<script type="module" src="explorer.js"></script>
</body>
</html>
