<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skills — Chrome Agent Platform</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <script type="module" src="../shared/apply-theme.js"></script>
    <script type="module" src="../shared/components.js"></script>
    <style>
    /* The recipes page is opened IN-CONTEXT from the hub (the view overlay
       provides the single Back button), so it has NO back button of its own.
       Layout mirrors the hub: a max-width column of intent-grouped
       <capability-row> lists — the same shared row component everywhere. */
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }
    .head {
      margin-bottom: 6px;
    }
    .logo { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.01em; }
    .logo span { color: var(--accent); }
    .sub {
      color: var(--muted);
      font-size: var(--text-sm);
      margin-bottom: 24px;
      max-width: 56ch;
    }
    .sub .muted { color: var(--muted); }

    .intent-group { margin-bottom: 24px; }
    .intent-head {
      font-size: var(--text-xs);
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 8px;
      padding: 0 14px;
    }
    .intent-group .recipe {
      border-bottom: 1px solid var(--border);
    }
    .intent-group .recipe:last-child { border-bottom: 0; }
    .recipe capability-row {
      display: block;
    }
    .recipe capability-row::part(row) {
      border-bottom: 0;
    }
    .recipe .how {
      padding: 0 14px 12px 54px; /* align with the row's label column (28px icon + 12px gap + 14px) */
      font-size: var(--text-xs);
      color: var(--muted);
    }
    .recipe .how summary {
      cursor: pointer;
      color: var(--text);
      font-weight: 600;
      font-size: var(--text-xs);
      margin-bottom: 6px;
      user-select: none;
    }
    .recipe .how summary:hover { color: var(--accent); }
    .recipe .how p {
      margin: 0 0 8px;
      line-height: 1.5;
      max-width: 70ch;
    }
    .recipe .how .hint {
      font-size: var(--text-xs);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--muted);
    }
    .empty { color: var(--muted); font-size: var(--text-sm); padding: 14px; }
    .import { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; }
    .import input { flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    .import .hint { color: var(--muted); font-size: var(--text-xs); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <div class="logo">Skills</div>
      </header>
      <p class="sub">
        Reusable capabilities, each documented below. A skill is included in a
        task — type <span class="muted">/skill:name</span> anywhere in the
        composer on the hub, or attach it to an agent. Use one here to start a
        task with it pre-filled.
      </p>
      <div class="import" id="import">
        <input id="import-url" type="url" placeholder="Import a skill — a GitHub repo or a SKILL.md URL" aria-label="Skill URL">
        <button id="import-btn" class="btn" type="button">Import</button>
        <span class="hint" id="import-status"></span>
      </div>
      <div id="recipes"></div>
    </div>
    <script type="module" src="recipes.js"></script>
  </body>
</html>
