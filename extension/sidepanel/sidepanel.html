<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
<title>Page companion — agent for this tab</title>
<link rel="icon" href="../icons/icon16.png">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
  /* The a11y main landmark forwards body's flex layout to the tab views. */
  body > main { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .tabs { display:flex; gap:4px; padding:8px 10px 0; border-bottom:1px solid var(--border); }
  .tabs [role="tab"] { border:0; background:transparent; color:var(--muted); font:inherit; font-weight:600;
    padding:8px 14px; cursor:pointer; border-bottom:2px solid transparent; min-height:44px; white-space:nowrap; }
  .tabs [role="tab"][aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); }
  .tabs [role="tab"]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* Controls never wrap inside themselves — "Open / site" wrapping at 360px was
     the reported layout bug. */
  .btn, .tabs [role="tab"], .companion-head .host, .toolstate { white-space: nowrap; }

  .views { display: contents; }

  /* ── the PAGE view: a companion pinned to the current tab ─────────────── */
  #page-view { flex: 1; display: flex; flex-direction: column; min-height: 0; container-type: inline-size; }
  #page-view[hidden] { display: none; }

  /* The current tab's identity: favicon + host + one tool-state line. */
  .companion-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .companion-head .fav-slot { flex: none; width: 20px; height: 20px; display: grid; place-items: center; color: var(--muted); }
  .companion-head .fav-slot img { width: 18px; height: 18px; border-radius: 4px; display: block; }
  .companion-head .fav-slot svg { display: block; }
  .companion-head .who { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .companion-head .host { font-weight: 600; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .companion-head .toolstate { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .continue-hub { flex: none; }

  .status { padding: 6px 14px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); }
  .status:empty { display: none; }
  .status.error { color: var(--danger, #b3261e); }

  /* the origin's discovered tools, as compact chips */
  .tools { padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-height: 96px; overflow: auto; }
  .tools:empty { display: none; }
  .tool-row { width: 100%; font-size: 12px; color: var(--muted); }
  .tool-row.empty { padding: 2px 0; }
  .tool-chip { display: inline-block; background: var(--panel-2, #efede8); color: var(--text); border-radius: 999px; padding: 2px 8px; font-size: var(--text-xs); font-family: var(--mono, monospace); }

  /* the conversation for this tab is the main, scrolling surface */
  #page-history { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; }

  .ledger-sect { padding: 10px 14px 12px; border-top: 1px solid var(--border); }
  .tasks-h { font-size: 11px; font-weight: 700; letter-spacing: .01em; color: var(--muted); margin: 0 0 6px; }

  .page-composer { padding: 10px 14px; border-top: 1px solid var(--border); }
  .open-another { padding: 0 14px 10px; }
  .open-another > summary { list-style: none; cursor: pointer; font-size: 12px; color: var(--muted); padding: 6px 0; min-height: 32px; display: flex; align-items: center; gap: 6px; }
  .open-another > summary:hover { color: var(--text); }
  .open-another > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .open-another > summary::-webkit-details-marker { display: none; }
  .open-another > summary .chev { transition: transform 150ms ease; }
  .open-another[open] > summary .chev { transform: rotate(90deg); }
  .open-row { display: flex; gap: 6px; align-items: center; padding-bottom: 6px; }
  .open-row input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 6px 10px; font: inherit; min-height: 36px; }

  /* ── the AGENTS view (CAP-FB-20260818-AGENT-ACCESS-01) ───────────────── */
  #agents-view { flex:1; display:flex; flex-direction:column; min-height:0; }
  #agents-view[hidden] { display:none; }
  #agents-list-pane { flex:1; overflow-y:auto; padding:12px 14px; }
  #agents-list-pane[hidden] { display:none; }
  .tasks-sect { margin-top:16px; border-top:1px solid var(--border); padding-top:10px; }
  #agents-tasks { display:flex; flex-direction:column; gap:2px; }
  #agents-tasks .tasks-empty { font-size:12.5px; color:var(--muted); padding:4px 2px; }
  #agent-detail-pane { flex:1; display:flex; flex-direction:column; min-height:0; }
  #agent-detail-pane[hidden] { display:none; }
  .ad-head { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); }
  .ad-back { display:inline-flex; align-items:center; gap:4px; min-height:44px; border:0; background:transparent;
    color:var(--muted); font:inherit; font-weight:600; cursor:pointer; padding:0 8px; border-radius:8px; white-space:nowrap; }
  .ad-back:hover { color:var(--text); background:var(--panel-2,#efede8); }
  .ad-back:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .ad-back svg { display:block; }
  .ad-who { min-width:0; display:flex; flex-direction:column; }
  .ad-name { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ad-kind { font-size:11px; color:var(--muted); }
  .ad-delete { margin-left:auto; display:inline-flex; align-items:center; min-height:32px; border:1px solid var(--border);
    background:transparent; color:var(--danger,#b3261e); font:inherit; font-size:12px; font-weight:600; cursor:pointer;
    padding:0 10px; border-radius:8px; white-space:nowrap; }
  .ad-delete:hover { background:var(--panel-2,#efede8); }
  .ad-delete:focus-visible { outline:2px solid var(--danger,#b3261e); outline-offset:2px; }
  #agent-history { flex:1; overflow-y:auto; padding:12px 14px; }
  .ad-composer { padding:10px 14px; border-top:1px solid var(--border); }

  /* Under a narrow panel, the "Open another site…" summary keeps its label but
     the Open button collapses to its icon so the row never wraps. */
  @container (max-width: 360px) {
    .open-row .go-label { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
    .open-row .btn { padding: 0 10px; }
  }
</style>
</head>
<body>
  <main>
  <h1 class="visually-hidden">Page companion</h1>
  <nav class="tabs" role="tablist" aria-label="Side panel views">
    <button type="button" role="tab" id="tab-page" aria-selected="true" aria-controls="page-view">Page</button>
    <button type="button" role="tab" id="tab-agents" aria-selected="false" aria-controls="agents-view">Agents</button>
  </nav>

  <div class="views">
  <section id="page-view" role="tabpanel" aria-labelledby="tab-page">
    <header class="companion-head">
      <span class="fav-slot" id="fav-slot" aria-hidden="true">
        <img id="tab-favicon" alt="" hidden>
        <svg id="tab-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
      </span>
      <div class="who">
        <span class="host" id="tab-host">This page</span>
        <span class="toolstate" id="tab-toolstate" role="status" aria-live="polite" aria-atomic="true"></span>
      </div>
      <button type="button" class="btn ghost continue-hub" id="continue-hub" hidden aria-label="Continue this conversation in the hub" title="Continue in hub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        <span class="continue-label">Hub</span>
      </button>
    </header>
    <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="tools" id="tools" aria-label="Available tools on this page"></div>
    <agent-conversation id="page-history" role="log" aria-live="polite" aria-relevant="additions"></agent-conversation>
    <section id="activity-ledger-section" class="ledger-sect" hidden aria-labelledby="ledger-h">
      <h2 class="tasks-h" id="ledger-h">Activity on this tab</h2>
      <action-ledger id="action-ledger" limit="10" aria-label="Recent actions with undo"></action-ledger>
    </section>
    <div class="page-composer">
      <agent-composer id="page-composer" placeholder="Ask about this page, or ask the agent to act on it…" send-label="Ask" label="Ask the agent about this page"></agent-composer>
    </div>
    <details class="open-another" id="open-another">
      <summary>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        Open another site…
      </summary>
      <div class="open-row">
        <input id="url" placeholder="https://…" aria-label="Site URL to open in a new tab">
        <button class="btn" id="go"><span class="go-label">Open</span></button>
      </div>
    </details>
  </section>

  <section id="agents-view" role="tabpanel" aria-labelledby="tab-agents" hidden>
    <div id="agents-list-pane">
      <agent-picker id="agents-picker" label="Agents" callable-only></agent-picker>
      <div class="tasks-sect">
        <h2 class="tasks-h">Scheduled tasks</h2>
        <div id="agents-tasks" role="list" aria-label="Scheduled tasks"></div>
      </div>
    </div>
    <div id="agent-detail-pane" hidden>
      <div class="ad-head">
        <button type="button" class="ad-back" id="agent-back" aria-label="Back to the agents list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          Agents
        </button>
        <div class="ad-who">
          <span class="ad-name" id="agent-detail-name">Agent</span>
          <span class="ad-kind" id="agent-detail-kind"></span>
        </div>
        <button type="button" class="ad-delete" id="agent-delete" aria-label="Delete agent" title="Delete agent">Delete</button>
      </div>
      <agent-conversation id="agent-history" role="log" aria-live="polite" aria-relevant="additions"></agent-conversation>
      <div class="ad-composer">
        <agent-composer id="agent-composer" placeholder="Direct a task to this agent…" send-label="Send" label="Message the agent"></agent-composer>
      </div>
    </div>
  </section>
  </div>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
