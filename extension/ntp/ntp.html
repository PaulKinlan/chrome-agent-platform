<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Hub — new tab</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <script type="module" src="../shared/apply-theme.js"></script>
    <script type="module" src="../shared/components.js"></script>
    <style>
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    /* ── header ── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .logo {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .logo span { color: var(--accent); }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-sm);
      color: var(--muted);
      margin-right: 4px;
    }
    .status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      flex: 0 0 auto;
    }
    .top-actions .icon-btn { color: var(--muted); }
    .top-actions .icon-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    /* ── composer is the hero ── */
    .composer { margin-bottom: 32px; }

    /* ── command-center sections ── */
    section { margin-bottom: 32px; }

    /* The activity overview: a single card list so the column reads calm. */
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--panel);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .panel-head .t {
      font-weight: 600;
      font-size: var(--text-base);
      margin: 0;
    }
    .panel-head .hint {
      font-size: var(--text-xs);
      color: var(--muted);
    }
    .panel-body { padding: 4px 0; }
    /* conversation (the <agent-conversation> now view) */
    #conversation { padding: 14px; }
    .panel-foot {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: var(--text-sm);
    }
    .empty {
      padding: 14px;
      color: var(--muted);
      font-size: var(--text-sm);
    }

    /* ── conversation (the "now" view) ── */
    .conversation .empty {
      color: var(--muted);
      font-size: var(--text-sm);
      padding: 14px;
    }

    /* ── in-context view (settings / directory / recipes, no new tab) ── */
    .view-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    .view-overlay[hidden] { display: none; }
    .view-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .view-head .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 6px 12px;
      cursor: pointer;
      font: inherit;
    }
    .view-head .back:hover, .view-head .back:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }
    .view-head .back svg { display: block; }
    .view-title { font-weight: 650; }
    .view-overlay iframe {
      flex: 1;
      border: 0;
      width: 100%;
      background: var(--bg);
    }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="logo">Chrome <span>Agent</span> Platform</div>
        <div class="top-actions">
          <span class="status" id="status" role="status" aria-live="polite"><span class="dot"></span>ready</span>
          <security-shield count="0" label="Security + permissions"></security-shield>
          <error-console count="0" label="Console (errors + warnings)"></error-console>
          <button class="btn ghost icon-btn" id="open-directory" aria-label="Directory (site agents)" title="Directory">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button class="btn ghost icon-btn" id="open-settings" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <agent-composer id="composer" placeholder="Ask anything, or @mention a site agent…" send-label="Run task"></agent-composer>

      <!-- Now: the active conversation (what the agent is doing / did). -->
      <section class="conversation" aria-label="Now">
        <div class="panel">
          <div class="panel-head">
            <h2 class="t">Now</h2>
            <span class="hint">the active conversation</span>
          </div>
          <agent-conversation id="conversation" role="log" aria-live="polite" aria-relevant="additions"></agent-conversation>
        </div>
      </section>

      <!-- Background agents: the scheduled recipes + their last run. -->
      <section aria-label="Background agents">
        <div class="panel">
          <div class="panel-head">
            <h2 class="t">Background agents</h2>
            <span class="hint">run quietly on a schedule</span>
          </div>
          <div class="panel-body" id="background-agents"></div>
          <div class="panel-foot">
            <button class="link" id="open-recipes">Browse all recipes →</button>
          </div>
        </div>
      </section>

      <!-- Site agents: enrolled origins. -->
      <section aria-label="Site agents">
        <div class="panel">
          <div class="panel-head">
            <h2 class="t">Site agents</h2>
            <span class="hint" id="site-agent-count"></span>
          </div>
          <div class="panel-body" id="site-agents"></div>
        </div>
      </section>

      <!-- Recent artifacts: what the agents have made. -->
      <section aria-label="Recent artifacts">
        <div class="panel">
          <div class="panel-head">
            <h2 class="t">Recent artifacts</h2>
            <span class="hint">things the agents created</span>
          </div>
          <div class="panel-body" id="artifacts"></div>
        </div>
      </section>
    </div>
    <div id="view" class="view-overlay" hidden>
      <div class="view-head">
        <button class="back" id="view-back" type="button" aria-label="Back to hub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </button>
        <span class="view-title" id="view-title">Settings</span>
      </div>
      <iframe id="view-frame" title="view"></iframe>
    </div>
    <script type="module" src="ntp.js"></script>
  </body>
</html>
