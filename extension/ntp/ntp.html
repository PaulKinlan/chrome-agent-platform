<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Hub — new tab</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <script type="module" src="../shared/apply-theme.js"></script>
    <script type="module" src="../shared/components.js"></script>
    <style>
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    /* ── header ── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .logo span {
      color: var(--accent);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      font-size: var(--text-sm);
      color: var(--muted);
      margin-right: 4px;
    }
    .status .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      margin-right: 6px;
      vertical-align: 1px;
    }
    .top-actions .icon-btn {
      color: var(--muted);
    }
    .top-actions .icon-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    /* ── composer is the hero ── */
    .composer {
      margin-bottom: 32px;
    }

    /* ── capabilities (unified: on-demand + background) ── */
    .capabilities {
      margin-bottom: 32px;
    }
    .capabilities h2 {
      margin: 0;
      font-size: var(--text-base);
      font-weight: 600;
    }
    .cap-hint {
      font-size: var(--text-xs);
      color: var(--muted);
    }
    .intent-group {
      margin-top: 20px;
    }
    .intent-head {
      font-size: var(--text-xs);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .cap-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--panel);
    }
    .cap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px 0 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
    }
    .cap:last-child {
      border-bottom: 0;
    }
    .cap-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0 10px 14px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .cap-main:hover,
    .cap-main:focus-visible {
      background: var(--bg);
      outline: none;
    }
    .cap-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      flex: 0 0 auto;
    }
    .cap-body {
      flex: 1;
      min-width: 0;
    }
    .cap-name {
      font-weight: 600;
      font-size: var(--text-sm);
    }
    .cap-desc {
      font-size: var(--text-xs);
      color: var(--muted);
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cap-run {
      flex: 0 0 auto;
      font-size: var(--text-xs);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      background: transparent;
      cursor: pointer;
      font: inherit;
    }
    .cap-run:hover,
    .cap-run:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      outline: none;
    }
    .cap .switch {
      flex: 0 0 auto;
      margin-right: 14px;
    }

    /* ── conversation ── */
    .conversation h2 {
      margin: 0 0 8px;
      font-size: var(--text-base);
      font-weight: 600;
    }
    .conversation .empty {
      color: var(--muted);
      font-size: var(--text-sm);
    }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="logo">Chrome <span>Agent</span> Platform</div>
        <div class="top-actions">
          <span class="status" id="status" role="status" aria-live="polite"><span class="dot"></span>ready</span>
          <button class="btn ghost icon-btn" id="open-directory" aria-label="Directory (site agents)" title="Directory">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button class="btn ghost icon-btn" id="open-settings" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <agent-composer id="composer" placeholder="Ask anything, or @mention a site agent…" send-label="Run task"></agent-composer>

      <section class="capabilities" id="capabilities-section">
        <div class="section-head">
          <h2>Capabilities</h2>
          <span class="cap-hint">Run once, or enable to run in the background</span>
        </div>
        <div id="capabilities"></div>
      </section>

      <section class="conversation">
        <div class="section-head">
          <h2>Conversation</h2>
        </div>
        <div id="conversation" role="log" aria-live="polite"
          aria-relevant="additions"></div>
      </section>
    </div>
    <script type="module" src="ntp.js"></script>
  </body>
</html>
