<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Hub — new tab</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/composer.css">
    <script type="module" src="../shared/apply-theme.js"></script>
    <script type="module" src="../shared/components.js"></script>
    <style>
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px;
    }
    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
    }
    .logo span {
      color: var(--accent);
    }
    .composer {
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 15px;
    }
    .agents {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .agent {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      color: var(--text);
      text-align: left;
    }
    .agent .name {
      font-weight: 600;
    }
    .agent .tools {
      color: var(--muted);
      font-size: 12px;
    }
    .task {
      border-top: 1px solid var(--border);
      padding: 10px 0;
    }
    .task .t {
      font-weight: 600;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .task .meta {
      color: var(--muted);
      font-size: 12px;
    }
    .settings {
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .settings input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      margin-left: 6px;
    }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="logo">Chrome <span>Agent</span> Platform</div>
        <div
          class="chip"><span class="dot"></span> <span id="status" role="status" aria-live="polite">agent ready</span></div>
      </div>

      <div class="settings" id="settings">
        <span class="muted">Provider: <span id="provider-name">loading…</span> — configured in Settings.</span>
        <label class="grant-toggle" id="grant-row">
          <input type="checkbox" id="browser-control-grant">
          <span>Allow the agent to control the browser (open/navigate/close tabs)</span>
        </label>
        <button class="btn ghost" id="open-settings">Settings</button>
        <button class="btn ghost" id="open-memory">Memory</button>
        <button class="btn ghost" id="open-directory">Directory</button>
      </div>

      <agent-composer id="composer" send-label="Run task"></agent-composer>

      <div class="grid">
        <div class="panel">
          <div class="recipes" style="margin-bottom:20px">
            <div class="tag">Recipes</div>
            <div id="recipes"
              style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
          </div>
          <h2>Active conversation</h2>
          <div id="tasks" role="status" aria-live="polite">
            <p style="color:var(--muted)">No tasks yet — start one above.</p>
          </div>
        </div>
        <div class="panel">
          <h2>Site agents</h2>
          <div class="agents"
            id="site-agents"><span style="color:var(--muted)">discovering…</span></div>
          <p
            style="color:var(--muted); font-size:12px; margin-top:12px;">Sites with WebMCP tools are callable agents. Sites without them get an inferred tool profile.</p>
        </div>
      </div>
    </div>
    <script type="module" src="ntp.js"></script>
  </body>
</html>
