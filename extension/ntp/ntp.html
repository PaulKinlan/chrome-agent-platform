<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Hub — new tab</title>
    <link rel="icon" href="../icons/icon16.png">
    <link rel="stylesheet" href="../shared/theme.css">
    <script type="module" src="../shared/apply-theme.js"></script>
    <script type="module" src="../shared/components.js"></script>
    <style>
    /* The hub is a COMMAND CENTER: a thread sidebar (left) + the main area
       (the composer hero + the activity overview). Mirrors the settings
       page's sidebar design for consistency. */
    body {
      display: flex;
      min-height: 100vh;
    }
    /* When an in-context view is open, hide the hub + freeze the page scroll so
       the background cannot scroll behind the overlay (the scrollbar belongs to
       the active view only). The sidebar stays visible for the task thread. */
    body.view-open {
      overflow: hidden;
      height: 100vh;
    }
    body.view-open main.content {
      display: none;
    }
    /* A full in-context view covers the hub entirely. Hide and de-activate the
       covered sidebar + edge control as state, rather than trying to out-stack
       the overlay. The task-thread view intentionally does not set this class. */
    body.full-view-open .side,
    body.full-view-open .side-toggle {
      visibility: hidden;
      pointer-events: none;
    }
    .side {
      inline-size: 240px;
      flex: 0 0 240px;
      min-inline-size: 0;
      min-block-size: 0;
      border-inline-end: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 4px;
      position: sticky;
      inset-block-start: 0;
      block-size: 100vh;
      overflow: clip;
      transition: inline-size .18s ease, flex-basis .18s ease;
    }
    /* collapsed → a narrow icon rail */
    .side.collapsed { inline-size: 60px; flex-basis: 60px; padding-inline: 10px; }
    .brand-row { display: flex; align-items: center; gap: 6px; }
    .brand-row .brand { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
    /* The collapse/expand control is an edge NUB protruding from the sidebar's
       right boundary — attached to the panel, discoverable, min 44×44 hit
       target (the visible tab is smaller). It is a SIBLING of #side (not a
       descendant) so its z-index competes in the root stacking context against
       the #thread-view overlay — a descendant's z-index would be trapped inside
       .side's sticky stacking context and painted under the overlay. */
    .side-toggle { display: inline-flex; align-items: center; justify-content: center;
      position: fixed; left: 240px; top: 50%; transform: translate(-50%, -50%);
      width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted);
      cursor: pointer; padding: 0; z-index: 110; transition: left .18s ease; }
    #side.collapsed ~ .side-toggle { left: 60px; }
    .side-toggle .nub { display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 36px; border: 1px solid var(--border); border-left: 0;
      border-radius: 0 9px 9px 0; background: var(--panel);
      transition: background .15s ease, color .15s ease, border-color .15s ease; }
    .side-toggle:hover .nub, .side-toggle:focus-visible .nub {
      color: var(--text); border-color: var(--accent); background: var(--panel-2, #efede8); }
    .side-toggle:focus-visible { outline: none; }
    .side-toggle:focus-visible .nub { box-shadow: 0 0 0 2px var(--accent); }
    .side-toggle svg { display: block; transition: transform .18s ease; }
    #side.collapsed ~ .side-toggle svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .side-toggle, .side-toggle .nub, .side-toggle svg, .side, #thread-view.view-overlay, #view.view-overlay { transition: none !important; }
    }
    /* RTL: the rail sits on the right — mirror the nub to the left edge, flip
       the horizontal translate (the nub protrudes LEFT now), and mirror the
       chevron + border so collapse/expand direction reads correctly. */
    [dir="rtl"] .side-toggle { left: auto; right: 240px; transform: translate(50%, -50%); }
    [dir="rtl"] #side.collapsed ~ .side-toggle { right: 60px; }
    [dir="rtl"] .side-toggle .nub { border-left: 1px solid var(--border); border-right: 0; border-radius: 9px 0 0 9px; }
    [dir="rtl"] .side-toggle svg { transform: scaleX(-1); }
    [dir="rtl"] #side.collapsed ~ .side-toggle svg { transform: scaleX(-1) rotate(180deg); }
    /* RTL: the rail's hairline border belongs on the INNER (left) edge. */
    [dir="rtl"] .side { border-inline-end: 1px solid var(--border); }
    /* RTL: the thread overlay must reserve space on the RIGHT (where the rail
       sits), mirroring the LTR left-inset, so the sidebar + nub stay visible
       beside the open overlay instead of being covered by it. */
    [dir="rtl"] #thread-view.view-overlay { left: 0; right: 240px; }
    [dir="rtl"] #side.collapsed ~ #thread-view.view-overlay { right: 60px; }
    /* Tasks and Agents are one layout primitive: the header never scrolls, while
       each intrinsic list owns its overflow. Stable, symmetric gutters keep row
       content still when a scrollbar appears without moving either + action. */
    .side-section {
      display: flex;
      flex: 1 1 0;
      flex-direction: column;
      min-inline-size: 0;
      min-block-size: 0;
      overflow: clip;
      border-block-start: 1px solid var(--border);
      padding-block-start: 6px;
    }
    .side-label-row { display: flex; align-items: center; gap: 4px; min-inline-size: 0; }
    .side-label-row .side-label { flex: 1 1 auto; min-inline-size: 0; }
    /* Rail action buttons (new-task / new-agent) share one icon scale. */
    .new-task { display: inline-flex; align-items: center; justify-content: center; inline-size: 28px; block-size: 28px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--accent);
      cursor: pointer; padding: 0; flex: 0 0 auto; margin-inline-start: auto; }
    .new-task svg { inline-size: 16px; block-size: 16px; display: block; }
    .new-task:hover { border-color: var(--accent); background: var(--on-accent-muted, #d7f0ea); }
    .side-list {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 2px;
      min-inline-size: 0;
      min-block-size: 0;
      overflow-x: clip;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable both-edges;
    }
    /* hide the text labels when collapsed (icon rail) */
    .side.collapsed .brand, .side.collapsed .side-label,
    .side.collapsed .thread-item .t-name, .side.collapsed .thread-item .t-preview,
    .side.collapsed .thread-item .t-meta,
    .side.collapsed .thread-empty,
    .side.collapsed .foot-btn .btn-label { display: none; }
    .side.collapsed .side-section { flex-basis: 0; padding-block-start: 4px; }
    .side.collapsed .side-list { scrollbar-gutter: auto; }
    .side.collapsed .side-list::-webkit-scrollbar { inline-size: 0; block-size: 0; }
    .side.collapsed .thread-item { padding: 8px; align-items: center; justify-content: center; min-block-size: 34px; }
    .side.collapsed .side-foot { align-items: center; }
    .side.collapsed .side-foot .foot-btn { inline-size: 34px; block-size: 34px; padding: 0; justify-content: center; }
    .side.collapsed .side-foot .foot-btn svg { inline-size: 16px; block-size: 16px; }
    /* the collapsed thread item is a centred status dot with a hover tooltip */
    .thread-item .t-dot { display: none; }
    .side.collapsed .thread-item .t-dot {
      display: block; inline-size: 8px; block-size: 8px; border-radius: 50%;
      background: var(--muted); flex: 0 0 auto;
    }
    /* when hovering a collapsed item, the dot hides so the centred delete X is clear */
    .side.collapsed .thread-item:hover .t-dot,
    .side.collapsed .thread-item:focus-within .t-dot { visibility: hidden; }
    .side.collapsed .thread-item .t-dot.running { background: var(--accent2); }
    .side.collapsed .thread-item .t-dot.error { background: var(--danger); }
    .brand {
      font-weight: 700;
      font-size: 16px;
      padding: 4px 8px 16px;
    }
    .brand span { color: var(--accent); }
    .side-label {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 10px 6px;
    }
    .agent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: start;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      min-inline-size: 0;
      inline-size: 100%;
    }
    .agent-item:hover { background: var(--panel-2); }
    .agent-item .a-avatar {
      inline-size: 24px;
      block-size: 24px;
      border-radius: 50%;
      object-fit: cover;
      flex: 0 0 auto;
      display: block;
      background: var(--panel-2);
    }
    .agent-item .a-name {
      flex: 1;
      min-inline-size: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      font-size: 14px;
    }
    .agent-item .a-role {
      display: block;
      font-weight: 400;
      font-size: var(--text-xs);
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .side.collapsed .agent-item { padding: 8px; justify-content: center; min-block-size: 40px; }
    .side.collapsed .agent-item .a-name { display: none; }
    /* Every rail row centres its single remaining icon when collapsed. */
    .side.collapsed .side-label-row { justify-content: center; }
    .side.collapsed .new-task { inline-size: 34px; block-size: 34px; margin-inline-start: 0; }
    /* the live run status banner (item: the user must see it is working). */
    .run-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--panel);
      font-size: 13px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .run-status .spin {
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: sc-runspin 1s linear infinite;
      flex: 0 0 auto;
    }
    @keyframes sc-runspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .run-status .spin { animation: none; } }
    .run-status.done { border-color: var(--success); color: var(--success); }
    .run-status.error { border-color: var(--danger); color: var(--danger); }
    .run-status .rs-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-status .rs-fix { font: inherit; font-size: 12px; font-weight: 600; color: var(--accent, #0e6e63); background: transparent; border: 1px solid var(--accent, #0e6e63); border-radius: 6px; padding: 3px 9px; cursor: pointer; flex: 0 0 auto; }
    .run-status .rs-fix:hover { background: var(--accent, #0e6e63); color: #fff; }
    /* the provider-status warning chip (the user must know BEFORE a run) */
    .provider-status { font: inherit; font-size: 12px; font-weight: 600; color: var(--danger, #b3261e); background: transparent; border: 1px solid var(--danger, #b3261e); border-radius: 999px; padding: 2px 10px; cursor: pointer; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .provider-status:hover { background: var(--danger, #b3261e); color: #fff; }
    /* the .run-status { display:flex } above would override the UA [hidden]
       display:none, so an empty banner stayed visible — restore it. */
    .run-status[hidden] { display: none; }
    .title-edit {
      font: inherit;
      font-weight: 650;
      color: var(--text);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      outline: none;
      width: 100%;
      padding: 0;
    }
    .thread-item {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      text-align: start;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      min-inline-size: 0;
      position: relative;
    }
    .thread-item:hover { background: var(--panel-2); }
    .thread-item[aria-current="true"] { background: var(--on-accent-muted); }
    .thread-item .t-delete {
      position: absolute;
      inset-block-start: 50%;
      inset-inline-end: 6px;
      z-index: 1;
      display: inline-flex;
      inline-size: 28px;
      block-size: 28px;
      transform: translateY(-50%);
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
    }
    .thread-item:hover .t-delete,
    .thread-item:focus-within .t-delete {
      opacity: 1;
      pointer-events: auto;
    }
    .thread-item .t-delete:hover { color: var(--danger); background: var(--bg); }
    .side.collapsed .thread-item .t-delete {
      inset-inline-start: 50%;
      inset-inline-end: auto;
      transform: translate(-50%, -50%);
    }
    .thread-item .t-name {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .thread-item .t-name .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--muted);
    }
    .thread-item .t-name .dot.running { background: var(--accent2); }
    .thread-item .t-name .dot.error { background: var(--danger); }
    .thread-item .t-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1 1 auto;
    }
    .thread-item .t-preview {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thread-item .t-meta {
      font-size: var(--text-xs);
      color: var(--muted);
    }
    .thread-empty {
      padding: 8px 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .side-foot {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #sidebar-durability-hint { font-size: 11px; line-height: 1.4; color: var(--warning, #9a6700); padding: 4px 8px; }
    #sidebar-durability-hint[hidden] { display: none; }
    /* The 60px icon rail is too narrow for the session/error text — hide the
       inline hint when collapsed so it can't wrap vertically and corrupt the
       rail layout (the status is still announced via the role=status live
       region, and reappears on expand). */
    .side.collapsed #sidebar-durability-hint { display: none; }
    /* (the collapse control is now the edge nub, not a foot row) */
    .foot-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
      width: 100%;
    }
    .foot-btn svg { flex: 0 0 auto; display: block; }

    .content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .main-wrap {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    /* ── header ── */
    .top {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 24px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-sm);
      color: var(--muted);
      margin-right: 4px;
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      flex: 0 0 auto;
    }
    .top-actions .icon-btn { color: var(--muted); }
    .top-actions .icon-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    /* ── composer is the hero ── */
    .composer { margin-bottom: 32px; }

    /* ── activity overview sections ── */
    section { margin-bottom: 32px; }
    .runlog { display: flex; flex-direction: column; gap: 4px; }
    .runlog .empty { padding: 8px 14px; color: var(--muted); font-size: 13px; }
    .rl { display: flex; gap: 10px; align-items: baseline; padding: 6px 14px; border-bottom: 1px solid var(--border); }
    .rl:last-child { border-bottom: 0; }
    .rl .rl-kind { flex: 0 0 auto; font-size: var(--text-xs); font-weight: 600; }
    .rl .rl-kind.task { color: var(--accent); }
    .rl .rl-kind.result { color: var(--muted); }
    .rl .rl-kind.tool-call, .rl .rl-kind.tool-result { color: var(--accent2); }
    .rl .rl-kind.screenshot { color: var(--accent2); }
    .rl .rl-text { flex: 1; min-width: 0; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rl .rl-ts { flex: 0 0 auto; font-size: var(--text-xs); color: var(--muted); }
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--panel);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .panel-head .t {
      font-weight: 600;
      font-size: var(--text-base);
      margin: 0;
    }
    .panel-head .hint {
      font-size: var(--text-xs);
      color: var(--muted);
    }
    .panel-subhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 4px;
      font-size: var(--text-xs);
      color: var(--muted);
      font-weight: 600;
    }
    .panel-subhead .hint-link {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
    }
    .panel-subhead .hint-link:hover, .panel-subhead .hint-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }
    .panel-body { padding: 4px 0; }
    .empty {
      padding: 14px;
      color: var(--muted);
      font-size: var(--text-sm);
    }

    /* ── in-context view (settings / directory / recipes, no new tab) ── */
    .view-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      z-index: 100;
      view-transition-name: overlay-view;
    }
    .view-overlay[hidden] { display: none; }
    .view-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .view-head .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 6px 12px;
      cursor: pointer;
      font: inherit;
    }
    .view-head .back:hover, .view-head .back:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }
    .view-head .back svg { display: block; }
    /* The `hidden` attribute is overridden by the inline-flex above (a class
       selector beats the UA `[hidden]` rule), so the Edit button leaked into
       views where it should be absent. Re-assert it. */
    .view-head .back[hidden] { display: none; }
    .view-title { font-weight: 650; }
    .view-overlay iframe {
      flex: 1;
      border: 0;
      width: 100%;
      background: var(--bg);
    }

    /* The task thread does NOT cover the sidebar: it fills the area to the
       RIGHT of the task sidebar so the sidebar (and its active-thread state)
       stays visible while inside a task (item 26). The settings/directory/
       recipes overlay (#view) stays full-screen. */
    #thread-view.view-overlay { top: 0; bottom: 0; right: 0; left: 240px; transition: left .18s ease, right .18s ease; }
    #side.collapsed ~ #thread-view.view-overlay { left: 60px; }

    /* ── the full-screen task thread ── */
    .thread-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px 24px;
      gap: 16px;
    }
    .thread-body agent-conversation {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--panel);
      padding: 16px;
    }
    .thread-body agent-composer { flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <aside class="side" id="side" aria-label="Tasks">
      <div class="brand-row">
        <div class="brand">Chrome <span>Agent</span> Platform</div>
      </div>
      <section class="side-section side-tasks" aria-labelledby="tasks-label">
        <div class="side-label-row">
          <span class="side-label" id="tasks-label">Tasks</span>
          <button class="new-task" id="new-task" type="button" aria-label="New task" title="New task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
        <nav class="side-list thread-list" id="thread-sidebar" aria-label="Task threads"></nav>
      </section>
      <section class="side-section side-agents" aria-labelledby="agents-label">
        <div class="side-label-row">
          <span class="side-label" id="agents-label">Agents</span>
          <button class="new-task" id="new-agent" type="button" aria-label="Create agent" title="Create agent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
        <div class="side-list agent-list" id="side-agents" aria-label="Named agents"></div>
      </section>
      <div class="side-foot">
        <span id="sidebar-durability-hint" role="status" aria-live="polite" hidden></span>
        <button class="btn ghost foot-btn" id="open-recipes" type="button" title="Skills">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span class="btn-label">Skills</span>
        </button>
        <button class="btn ghost foot-btn" id="open-directory" type="button" title="Directory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span class="btn-label">Directory</span>
        </button>
        <button class="btn foot-btn" id="open-settings" type="button" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="btn-label">Settings</span>
        </button>
      </div>
    </aside>

    <!-- The collapse/expand edge nub — a SIBLING of the sidebar (not a child) so
         its z-index competes in the root stacking context against the overlays. -->
    <button class="side-toggle" id="side-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="side" title="Collapse sidebar">
      <span class="nub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></span>
    </button>

    <main class="content">
      <div class="main-wrap">
        <header class="top">
          <div class="top-actions">
            <span class="status" id="status" role="status" aria-live="polite" hidden></span>
            <button type="button" class="provider-status" id="provider-status" hidden title="Open Settings to fix the provider"></button>
            <security-shield count="0" label="Security + permissions"></security-shield>
            <error-console count="0" label="Console (errors + warnings)"></error-console>
          </div>
        </header>

        <agent-composer id="composer" placeholder="Ask anything, or @mention a site agent…" send-label="Run task"></agent-composer>

        <!-- Agents: the two groupings — background agents (scheduled) + site agents (enrolled origins). -->
        <section aria-label="Agents">
          <div class="panel">
            <div class="panel-head">
              <h2 class="t">Agents</h2>
              <span class="hint" id="agent-count"></span>
            </div>
            <div class="panel-subhead"><span>Named agents</span><span class="hint">your agents</span></div>
            <div class="panel-body" id="named-agents"></div>
            <div class="panel-subhead"><span>Background agents</span><a href="#" class="hint-link" id="bg-configure">Configure</a></div>
            <div class="panel-body" id="background-agents"></div>
            <div class="panel-subhead"><span>Site agents</span><a href="#" class="hint-link" id="discover-page">Discover this page</a></div>
            <div class="panel-body" id="site-agents"></div>
            <div class="panel-body webmcp-hub-status muted" id="webmcp-hub-status" aria-live="polite"></div>
          </div>
        </section>

        <!-- Recent artifacts: what the agents have made. -->
        <section aria-label="Recent artifacts">
          <div class="panel">
            <div class="panel-head">
              <h2 class="t">Recent artifacts</h2>
              <a href="#" class="hint-link" id="browse-artifacts">Browse all</a>
            </div>
            <div class="panel-body" id="artifacts"></div>
          </div>
        </section>

        <!-- Recent activity: the agent run log (what the agents DID — their
             tasks, tool calls, and results, so a background agent's work is
             visible even without a live UI). -->
        <section aria-label="Recent activity">
          <div class="panel">
            <div class="panel-head">
              <h2 class="t">Recent activity</h2>
              <span class="hint" id="hub-usage">what the agents did</span>
            </div>
            <div class="panel-body runlog" id="run-log"></div>
          </div>
        </section>
      </div>
    </main>

    <div id="view" class="view-overlay" hidden>
      <div class="view-head">
        <button class="back" id="view-back" type="button" aria-label="Back to hub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </button>
        <span class="view-title" id="view-title">Settings</span>
      </div>
      <iframe id="view-frame" title="view"></iframe>
    </div>
    <div id="thread-view" class="view-overlay" hidden>
      <div class="view-head">
        <button class="back" id="thread-back" type="button" aria-label="Back to hub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </button>
        <span class="view-title" id="thread-title">Task</span>
        <button class="back subtle" id="edit-agent" type="button" aria-label="Edit agent" hidden>Edit</button>
      </div>
      <div class="thread-body">
        <div class="run-status" id="run-status" hidden role="status" aria-live="polite"></div>
        <durable-run-registry id="durable-run-registry"></durable-run-registry>
        <agent-conversation id="thread-conversation" role="log" aria-live="polite" aria-relevant="additions"></agent-conversation>
        <agent-composer id="thread-composer" placeholder="Reply, or @mention a site agent…" send-label="Send"></agent-composer>
      </div>
    </div>
    <script type="module" src="ntp.js"></script>
  </body>
</html>
