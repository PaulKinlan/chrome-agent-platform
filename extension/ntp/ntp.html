<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Hub — new tab</title>
    <link rel="icon" href="../icons/icon16.png">
    <link rel="stylesheet" href="../shared/theme.css">
    <script type="module" src="../shared/apply-theme.js"></script>
    <script type="module" src="../shared/components.js"></script>
    <style>
    /* The hub is a COMMAND CENTER: a thread sidebar (left) + the main area
       (the composer hero + the activity overview). Mirrors the settings
       page's sidebar design for consistency. */
    body {
      display: flex;
      min-height: 100vh;
    }
    .side {
      width: 240px;
      flex: 0 0 240px;
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      transition: width .18s ease, flex-basis .18s ease;
    }
    /* collapsed → a narrow icon rail */
    .side.collapsed { width: 60px; flex-basis: 60px; padding-left: 10px; padding-right: 10px; }
    .brand-row { display: flex; align-items: center; gap: 6px; }
    .brand-row .brand { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
    .side-toggle { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--muted);
      cursor: pointer; padding: 0; flex: 0 0 auto; }
    .side-toggle:hover { color: var(--text); border-color: var(--accent); }
    .side-toggle svg { display: block; transition: transform .18s ease; }
    .side.collapsed .side-toggle svg { transform: rotate(180deg); }
    .side-label-row { display: flex; align-items: center; gap: 4px; }
    .side-label-row .side-label { flex: 1; min-width: 0; }
    .new-task { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--accent);
      cursor: pointer; padding: 0; font-size: 18px; line-height: 1; flex: 0 0 auto; }
    .new-task:hover { border-color: var(--accent); background: var(--on-accent-muted, #d7f0ea); }
    /* hide the text labels when collapsed (icon rail) */
    .side.collapsed .brand, .side.collapsed .side-label,
    .side.collapsed .thread-item .t-name, .side.collapsed .thread-item .t-preview,
    .side.collapsed .thread-item .t-meta,
    .side.collapsed .thread-empty,
    .side.collapsed .foot-btn .btn-label { display: none; }
    .side.collapsed .thread-item { padding: 8px; align-items: center; justify-content: center; min-height: 34px; }
    .side.collapsed .side-foot { align-items: center; }
    .side.collapsed .side-foot .foot-btn { width: 34px; height: 34px; padding: 0; justify-content: center; }
    .side.collapsed .side-foot .foot-btn svg { width: 17px; height: 17px; }
    /* the collapsed thread item is a centred status dot with a hover tooltip */
    .thread-item .t-dot { display: none; }
    .side.collapsed .thread-item .t-dot {
      display: block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex: 0 0 auto;
    }
    .side.collapsed .thread-item .t-dot.running { background: var(--accent2); }
    .side.collapsed .thread-item .t-dot.error { background: var(--danger); }
    .brand {
      font-weight: 700;
      font-size: 16px;
      padding: 4px 8px 16px;
    }
    .brand span { color: var(--accent); }
    .side-label {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 12px 6px;
    }
    .thread-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      overflow-y: auto;
    }
    /* Named agents in the sidebar: a compact list below the tasks (item: a
       created agent must be visible here, not just in the main area). */
    .side-agents {
      border-top: 1px solid var(--border);
      padding-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 0 0 auto;
      max-height: 32%;
      overflow-y: auto;
    }
    .agent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      padding: 6px 12px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      min-width: 0;
      width: 100%;
    }
    .agent-item:hover { background: var(--bg); }
    .agent-item .a-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      flex: 0 0 auto;
      display: block;
      background: var(--panel-2);
    }
    .agent-item .a-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      font-size: 13px;
    }
    .agent-item .a-role {
      display: block;
      font-weight: 400;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .side.collapsed .agent-item { padding: 8px; justify-content: center; }
    .side.collapsed .agent-item .a-name { display: none; }
    .side.collapsed .side-agents .side-label-row { display: none; }
    /* the live run status banner (item: the user must see it is working). */
    .run-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      font-size: 13px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .run-status .spin {
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: sc-runspin 1s linear infinite;
      flex: 0 0 auto;
    }
    @keyframes sc-runspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .run-status .spin { animation: none; } }
    .run-status.done { border-color: var(--success); color: var(--success); }
    .run-status.error { border-color: var(--danger); color: var(--danger); }
    .run-status .rs-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* the .run-status { display:flex } above would override the UA [hidden]
       display:none, so an empty banner stayed visible — restore it. */
    .run-status[hidden] { display: none; }
    .title-edit {
      font: inherit;
      font-weight: 650;
      color: var(--text);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      outline: none;
      width: 100%;
      padding: 0;
    }
    .thread-item {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      text-align: left;
      padding: 8px 12px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      min-width: 0;
      position: relative;
    }
    .thread-item:hover { background: var(--bg); }
    .thread-item[aria-current="true"] {
      background: var(--bg);
    }
    .thread-item .t-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      display: none;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      line-height: 1;
    }
    .thread-item:hover .t-delete,
    .thread-item .t-delete:focus-visible { display: inline-flex; }
    .thread-item .t-delete:hover { color: var(--danger); background: var(--panel-2); }
    .thread-item .t-name {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .thread-item .t-name .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--muted);
    }
    .thread-item .t-name .dot.running { background: var(--accent2); }
    .thread-item .t-name .dot.error { background: var(--danger); }
    .thread-item .t-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1 1 auto;
    }
    .thread-item .t-preview {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thread-item .t-meta {
      font-size: 11px;
      color: var(--muted);
    }
    .thread-empty {
      padding: 8px 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .side-foot {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    /* the collapse chevron lives at the BOTTOM of the sidebar (item 26) — the
       brand row at the top was overlapping the heading; a dedicated foot row is
       cleaner. */
    .side-collapse-row {
      display: flex;
      justify-content: flex-end;
      padding-top: 2px;
    }
    .side.collapsed .side-collapse-row { justify-content: center; }
    .foot-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      justify-content: flex-start;
      width: 100%;
    }
    .foot-btn svg { flex: 0 0 auto; display: block; }

    .content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .main-wrap {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    /* ── header ── */
    .top {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 24px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-sm);
      color: var(--muted);
      margin-right: 4px;
    }
    .status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      flex: 0 0 auto;
    }
    .top-actions .icon-btn { color: var(--muted); }
    .top-actions .icon-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    /* ── composer is the hero ── */
    .composer { margin-bottom: 32px; }

    /* ── activity overview sections ── */
    section { margin-bottom: 32px; }
    .runlog { display: flex; flex-direction: column; gap: 4px; }
    .runlog .empty { padding: 8px 14px; color: var(--muted); font-size: 13px; }
    .rl { display: flex; gap: 10px; align-items: baseline; padding: 6px 14px; border-bottom: 1px solid var(--border); }
    .rl:last-child { border-bottom: 0; }
    .rl .rl-kind { flex: 0 0 auto; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .rl .rl-kind.task { color: var(--accent); }
    .rl .rl-kind.result { color: var(--muted); }
    .rl .rl-kind.tool-call, .rl .rl-kind.tool-result { color: var(--accent2); }
    .rl .rl-kind.screenshot { color: var(--accent2); }
    .rl .rl-text { flex: 1; min-width: 0; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rl .rl-ts { flex: 0 0 auto; font-size: 11px; color: var(--muted); }
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--panel);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .panel-head .t {
      font-weight: 600;
      font-size: var(--text-base);
      margin: 0;
    }
    .panel-head .hint {
      font-size: var(--text-xs);
      color: var(--muted);
    }
    .panel-subhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 4px;
      font-size: var(--text-xs);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      font-weight: 600;
    }
    .panel-subhead .hint-link {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
    }
    .panel-subhead .hint-link:hover, .panel-subhead .hint-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }
    .panel-body { padding: 4px 0; }
    .empty {
      padding: 14px;
      color: var(--muted);
      font-size: var(--text-sm);
    }

    /* ── in-context view (settings / directory / recipes, no new tab) ── */
    .view-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      z-index: 100;
      view-transition-name: overlay-view;
    }
    .view-overlay[hidden] { display: none; }
    .view-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .view-head .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 6px 12px;
      cursor: pointer;
      font: inherit;
    }
    .view-head .back:hover, .view-head .back:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }
    .view-head .back svg { display: block; }
    .view-title { font-weight: 650; }
    .view-overlay iframe {
      flex: 1;
      border: 0;
      width: 100%;
      background: var(--bg);
    }

    /* The task thread does NOT cover the sidebar: it fills the area to the
       RIGHT of the task sidebar so the sidebar (and its active-thread state)
       stays visible while inside a task (item 26). The settings/directory/
       recipes overlay (#view) stays full-screen. */
    #thread-view.view-overlay { top: 0; bottom: 0; right: 0; left: 240px; transition: left .18s ease; }
    #side.collapsed ~ #thread-view.view-overlay { left: 60px; }

    /* ── the full-screen task thread ── */
    .thread-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px 24px;
      gap: 16px;
    }
    .thread-body agent-conversation {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--panel);
      padding: 16px;
    }
    .thread-body agent-composer { flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <aside class="side" id="side" aria-label="Tasks">
      <div class="brand-row">
        <div class="brand">Chrome <span>Agent</span> Platform</div>
      </div>
      <div class="side-label-row">
        <span class="side-label">Tasks</span>
        <button class="new-task" id="new-task" type="button" aria-label="New task" title="New task">+</button>
      </div>
      <nav class="thread-list" id="thread-sidebar" aria-label="Task threads"></nav>
      <div class="side-agents">
        <div class="side-label-row"><span class="side-label">Agents</span></div>
        <div class="agent-list" id="side-agents" aria-label="Named agents"></div>
      </div>
      <div class="side-foot">
        <button class="btn ghost foot-btn" id="open-recipes" type="button" title="Recipes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span class="btn-label">Recipes</span>
        </button>
        <button class="btn ghost foot-btn" id="open-directory" type="button" title="Directory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span class="btn-label">Directory</span>
        </button>
        <div class="side-collapse-row">
          <button class="side-toggle" id="side-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </div>
        <button class="btn foot-btn" id="open-settings" type="button" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="btn-label">Settings</span>
        </button>
      </div>
    </aside>

    <main class="content">
      <div class="main-wrap">
        <header class="top">
          <div class="top-actions">
            <span class="status" id="status" role="status" aria-live="polite" hidden></span>
            <security-shield count="0" label="Security + permissions"></security-shield>
            <error-console count="0" label="Console (errors + warnings)"></error-console>
          </div>
        </header>

        <agent-composer id="composer" placeholder="Ask anything, or @mention a site agent…" send-label="Run task"></agent-composer>

        <!-- Agents: the two groupings — background agents (scheduled) + site agents (enrolled origins). -->
        <section aria-label="Agents">
          <div class="panel">
            <div class="panel-head">
              <h2 class="t">Agents</h2>
              <span class="hint" id="agent-count"></span>
            </div>
            <div class="panel-subhead"><span>Named agents</span><span class="hint">your agents</span></div>
            <div class="panel-body" id="named-agents"></div>
            <div class="panel-subhead"><span>Background agents</span><a href="#" class="hint-link" id="bg-configure">Configure</a></div>
            <div class="panel-body" id="background-agents"></div>
            <div class="panel-subhead"><span>Site agents</span><span class="hint">enrolled origins</span></div>
            <div class="panel-body" id="site-agents"></div>
          </div>
        </section>

        <!-- Recent artifacts: what the agents have made. -->
        <section aria-label="Recent artifacts">
          <div class="panel">
            <div class="panel-head">
              <h2 class="t">Recent artifacts</h2>
              <a href="#" class="hint-link" id="browse-artifacts">Browse all</a>
            </div>
            <div class="panel-body" id="artifacts"></div>
          </div>
        </section>

        <!-- Recent activity: the agent run log (what the agents DID — their
             tasks, tool calls, and results, so a background agent's work is
             visible even without a live UI). -->
        <section aria-label="Recent activity">
          <div class="panel">
            <div class="panel-head">
              <h2 class="t">Recent activity</h2>
              <span class="hint">what the agents did</span>
            </div>
            <div class="panel-body runlog" id="run-log"></div>
          </div>
        </section>
      </div>
    </main>

    <div id="view" class="view-overlay" hidden>
      <div class="view-head">
        <button class="back" id="view-back" type="button" aria-label="Back to hub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </button>
        <span class="view-title" id="view-title">Settings</span>
      </div>
      <iframe id="view-frame" title="view"></iframe>
    </div>
    <div id="thread-view" class="view-overlay" hidden>
      <div class="view-head">
        <button class="back" id="thread-back" type="button" aria-label="Back to hub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </button>
        <span class="view-title" id="thread-title">Task</span>
      </div>
      <div class="thread-body">
        <div class="run-status" id="run-status" hidden role="status" aria-live="polite"></div>
        <agent-conversation id="thread-conversation" role="log" aria-live="polite" aria-relevant="additions"></agent-conversation>
        <agent-composer id="thread-composer" placeholder="Reply, or @mention a site agent…" send-label="Send"></agent-composer>
      </div>
    </div>
    <script type="module" src="ntp.js"></script>
  </body>
</html>
